name: Docker Build and Publish

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

jobs:
  call-docker-publish:
    permissions:
      contents: read
      packages: write
    uses: wolf-infra/.github/.github/workflows/docker-publish.yml@main
  
  update-readme:
    needs: [call-docker-publish]
    # Only run this on main or tags to avoid PR noise
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false 
          fetch-depth: 0

      - name: Calculate Metrics
        id: metrics
        run: |
          # Get Go Version from go.mod
          GO_VER=$(grep "^go " go.mod | awk '{print $2}')
          echo "go_version=$GO_VER" >> $GITHUB_OUTPUT

          # Always use the actual version number for the badge
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # If pushing a new tag, use that exact tag (e.g., v1.0.2)
            REL_VER=${GITHUB_REF#refs/tags/}
            PULL_TAG=$REL_VER
          else
            # If pushing to main, ask git for the most recent tag (e.g., v1.0.1)
            REL_VER=$(git describe --tags --abbrev=0)
            # But pull the 'latest' image so the Size badge reflects the current commit
            PULL_TAG="latest"
          fi
          
          echo "release_version=$REL_VER" >> $GITHUB_OUTPUT

          # Get Docker Image Size
          IMAGE_NAME="ghcr.io/${{ github.repository }}:$PULL_TAG"
          docker pull $IMAGE_NAME
          SIZE=$(docker images $IMAGE_NAME --format "{{.Size}}")
          echo "docker_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Update README Badges
        run: |
          # Use sed to find the Shields.io patterns and swap them
          # We use | as a delimiter in sed because the URLs contain /
          sed -i "s/size-.*-blue/size-${{ steps.metrics.outputs.docker_size }}-blue/" README.md
          sed -i "s/Go-.*-00ADD8/Go-${{ steps.metrics.outputs.go_version }}-00ADD8/" README.md
          sed -i "s/version-.*-orange/version-${{ steps.metrics.outputs.release_version }}-orange/" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "Wolf-Infrastructure-Bot[bot]"
          git config --global user.email "Wolf-Infrastructure-Bot[bot]@users.noreply.github.com"
          
          if git diff --quiet README.md; then
            echo "No changes."
          else
            git add README.md
            git commit -m "docs: automate badge updates [skip ci]"
            
            git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}.git
            git push origin main
          fi
  create-release:
    # Only run this job if the push was a tag starting with 'v'
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [call-docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
