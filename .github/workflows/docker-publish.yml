name: Docker Build and Publish

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

jobs:
  call-docker-publish:
    permissions:
      contents: read
      packages: write
    uses: wolf-infra/.github/.github/workflows/docker-publish.yml@main
  
  update-readme:
    needs: [call-docker-publish]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false 
          fetch-depth: 0

      - name: Calculate Metrics
        id: metrics
        run: |
          # Get Go Version
          GO_VER=$(grep "^go " go.mod | awk '{print $2}')
          echo "go_version=$GO_VER" >> $GITHUB_OUTPUT

          # Determine Version logic (no more PULL_TAG needed!)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            REL_VER=${GITHUB_REF#refs/tags/}
          else
            # Fallback to v0.0.0 if no tags exist yet
            REL_VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          echo "release_version=$REL_VER" >> $GITHUB_OUTPUT

      - name: Update README Badges
        run: |
          # Update the Shields.io badge values
          # Pulling the image_size directly from the reusable workflow's outputs!
          sed -i "s/size-.*-blue/size-${{ needs.call-docker-publish.outputs.image_size }}-blue/" README.md
          sed -i "s/Go-.*-00ADD8/Go-${{ steps.metrics.outputs.go_version }}-00ADD8/" README.md
          sed -i "s/version-.*-orange/version-${{ steps.metrics.outputs.release_version }}-orange/" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "Wolf-Infrastructure-Bot[bot]"
          git config --global user.email "Wolf-Infrastructure-Bot[bot]@users.noreply.github.com"

          git add README.md
          
          if ! git diff --staged --quiet; then
            git commit -m "docs: automate badge updates [skip ci]"
            git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}.git
            
            # 3. Push from HEAD to main to completely avoid detached HEAD errors
            git push origin HEAD:main
          else
            echo "No changes to README. Skipping commit."
          fi

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [call-docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Strip the 'refs/tags/' prefix to just get the tag name (e.g., 'v1.1.0')
      - name: Get Tag Name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          # Append a custom message above the auto-generated changelog to link the Docker package
          body: |
            **Docker Image Available**
            This release is published to the GitHub Container Registry. Pull it directly:
            
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.get_tag.outputs.TAG_NAME }}
            ```
