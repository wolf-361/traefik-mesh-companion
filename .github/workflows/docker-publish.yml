name: Docker Build and Publish

on:
    push:
        branches: ["main"]
        tags: ["v*.*.*"]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: actions/setup-buildx-action@v3

            - name: Log into registry ${{ env.REGISTRY }}
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # "latest" only for the main branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      # "stable" only for the most recent tag
                      type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      # Proper SemVer (v1.2.3, v1.2, v1)
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Short SHA for unique identification
                      type=sha,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ id.meta.outputs.tags }}
                  labels: ${{ id.meta.outputs.labels }}
                  # This ensures the cache is reused for faster subsequent builds
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
